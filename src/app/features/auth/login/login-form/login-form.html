<div class="card">
  <h3>Login</h3>
  <form>
    <div class="text-field">
      <label>Email:</label>
      <input type="email" [field]="loginForm.email" />
    </div>
    <div class="text-field">
      <label>Password:</label>
      <input type="password" [field]="loginForm.password" />
    </div>
  </form>
</div>
