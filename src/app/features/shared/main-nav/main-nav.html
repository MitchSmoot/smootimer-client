<nav>
  <img src="Smootimer-nav-1.png" class="nav-icon" routerLink="">
  <ul>
    <li>
      <a routerLink="/timer">Timer</a>
    </li>
    <li>
      <a routerLink="/users">Users</a>
    </li> 
    <li>
      <a routerLink="/import">Import</a>
    </li> 
    <li>
      <a (click)="toggleTheme()">Theme</a>
    </li>          
    @if (auth.isAuthenticated) {
      <li>
        <a class="nav-user" routerLink="/users/{{ users.currentUser()?.identity.toString() }}">{{ users.currentUser()?.name ?? auth.profile?.name ?? auth.profile?.email }}</a>
      </li>
      <li>
        <a (click)="auth.logout()">Logout</a>
      </li>
    } @else {
      <li>
        <a (click)="auth.login()">Login</a>
      </li>
    }
  </ul>
  <button type="button" data-toggle="collapse"aria-expanded="false" aria-label="Toggle navigation">
    <span>Button</span>
  </button>
</nav>
